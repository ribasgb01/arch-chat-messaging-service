<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de WebSocket STOMP</title>
    <!-- Carrega a biblioteca oficial do STOMP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h2>⚡ Teste de Tempo Real - Chat & RabbitMQ</h2>
<p>Abra o console do navegador (F12) para ver os logs detalhados.</p>

<button onclick="conectar()">🔌 Conectar no WebSocket</button>
<div id="status" style="margin-top: 20px; font-weight: bold;">Status: Desconectado</div>
<div id="mensagens" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px; min-height: 100px;">
    <h3>💬 Mensagens Recebidas:</h3>
</div>

<script>
    function conectar() {
        var url = "ws://localhost:8082/ws"; // [3]
        var client = Stomp.client(url); // Inicia o cliente STOMP [1.1.2]

        document.getElementById("status").innerText = "Status: Conectando...";

        // 1. Tenta realizar o Handshake físico e o CONNECT do STOMP [1.1.2, 3]
        client.connect({}, function (frame) {
            document.getElementById("status").innerText = "Status: CONECTADO!";
            console.log("Conectado com sucesso ao STOMP Broker Relay: " + frame); [1.1.2]

            // 2. INSIRA AQUI O ID DO CHAT que você criou no seu banco MongoDB! [3]
            var chatId = "154c9553-6953-42dc-8bdf-d3be0312e8f0";

            // 3. Se inscreve no tópico da sala utilizando a Routing Key [3]
            var topico = "/topic/chat.message." + chatId;
            console.log("Inscrevendo no tópico: " + topico);

            client.subscribe(topico, function (message) {
                // 4. Este bloco roda automaticamente quando uma mensagem nova chega do RabbitMQ! [3]
                console.log("Nova mensagem recebida em tempo real: ", message.body);

                // Renderiza a mensagem na tela de forma simples
                var msgJson = JSON.parse(message.body);
                var p = document.createElement("p");
                p.innerHTML = "<b>" + msgJson.senderId + ":</b> " + msgJson.content;
                document.getElementById("mensagens").appendChild(p);
            });

        }, function (error) {
            document.getElementById("status").innerText = "Status: ERRO DE CONEXÃO";
            console.error("Erro na conexão STOMP: " + error);
        });
    }
</script>
</body>
</html>
