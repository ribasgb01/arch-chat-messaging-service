services:
  db:
    image: postgres:16.4-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'chat_friendship_db'
    ports:
      - '5432:5432'

  mongo_db:
    image: mongo:latest
    container_name: mongo_db
    restart: always
    ports:
      - '27017:27017'